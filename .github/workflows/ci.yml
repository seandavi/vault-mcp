name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install ripgrep (exact/regex search modes shell out to rg)
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: uv sync
      - run: uv run pytest
