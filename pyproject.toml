[project]
name = "vault-mcp"
version = "0.1.0"
description = "MCP server exposing a markdown vault as an agent memory substrate"
readme = "README.md"
authors = [
    { name = "Sean Davis", email = "seandavi@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "duckdb>=1.5.5",
    "fastmcp>=3.4.6",
    "pyyaml>=6.0.3",
]

[project.scripts]
vault-mcp = "vault_mcp:main"

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
